<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ReverseAI</title>
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
<style>
  :root {
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
               "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    --accent: #0a84ff;
    --accent-weak: rgba(10,132,255,.12);
    --bg: #f5f5f7;
    --bg-elev: #ffffff;
    --bg-sunken: #fbfbfd;
    --text: #1d1d1f;
    --text-dim: #6e6e73;
    --border: rgba(0,0,0,.09);
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
    --believed: #ff9f0a; --observed: #0a84ff; --verified: #30d158;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#000000; --bg-elev:#1c1c1e; --bg-sunken:#141416; --text:#f5f5f7;
      --text-dim:#98989d; --border:rgba(255,255,255,.12);
      --accent:#0a84ff; --accent-weak:rgba(10,132,255,.18);
      --shadow:0 1px 3px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:#000000; --bg-elev:#1c1c1e; --bg-sunken:#141416; --text:#f5f5f7;
    --text-dim:#98989d; --border:rgba(255,255,255,.12);
    --accent:#0a84ff; --accent-weak:rgba(10,132,255,.18);
    --shadow:0 1px 3px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-ui); background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  /* top bar */
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 20px;
    background: color-mix(in srgb, var(--bg-elev) 80%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border); z-index: 10; flex: none;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b { font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
  .brand span { color: var(--text-dim); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim);
         box-shadow: 0 0 0 0 var(--accent); }
  .dot.live { background: var(--verified); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(48,209,88,.5)} 70%{box-shadow:0 0 0 7px rgba(48,209,88,0)} 100%{box-shadow:0 0 0 0 rgba(48,209,88,0)} }
  .spacer { flex: 1; }
  .pill { font-size: 12px; color: var(--text-dim); padding: 5px 11px;
          border: 1px solid var(--border); border-radius: 999px; background: var(--bg-sunken); }
  .icon-btn { border: 1px solid var(--border); background: var(--bg-sunken); color: var(--text);
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 15px; }
  .icon-btn:hover { background: var(--accent-weak); }

  /* layout */
  main { flex: 1; display: grid; grid-template-columns: 320px 1fr 1fr; gap: 0;
         min-height: 0; }
  .col { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .col + .col { border-left: 1px solid var(--border); }
  .col-head { padding: 13px 18px; font-size: 12px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex: none; }
  .col-body { flex: 1; overflow-y: auto; padding: 16px 18px; }

  /* form */
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 14px 0 6px; font-weight: 500; }
  textarea, input[type=text], select {
    width: 100%; font-family: var(--font-ui); font-size: 14px; color: var(--text);
    background: var(--bg-sunken); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  textarea:focus, input:focus, select:focus { border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-weak); }
  textarea { resize: vertical; min-height: 92px; line-height: 1.45; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button.run {
    margin-top: 18px; width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
    color: #fff; background: var(--accent); border: none; border-radius: 11px;
    cursor: pointer; transition: transform .08s, filter .15s; font-family: var(--font-ui);
  }
  button.run:hover { filter: brightness(1.07); }
  button.run:active { transform: scale(.985); }
  button.run:disabled { opacity: .5; cursor: default; }

  .history { margin-top: 22px; border-top: 1px solid var(--border); padding-top: 14px; }
  .history h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-dim); margin: 0 0 10px; }
  .hist-item { padding: 9px 11px; border-radius: 10px; font-size: 12.5px; cursor: pointer;
    border: 1px solid transparent; color: var(--text-dim); }
  .hist-item:hover { background: var(--bg-sunken); border-color: var(--border); color: var(--text); }

  /* stream */
  .stream-item { animation: fade .25s ease; margin-bottom: 12px; }
  @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .step-sep { display: flex; align-items: center; gap: 10px; margin: 18px 0 10px; color: var(--text-dim);
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .step-sep::after { content:""; flex:1; height:1px; background: var(--border); }
  .assistant { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px 15px; box-shadow: var(--shadow); font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .tool { background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; }
  .tool-head { display: flex; align-items: center; gap: 9px; padding: 10px 14px; cursor: pointer;
    font-size: 13.5px; font-weight: 550; }
  .tool-head:hover { background: var(--accent-weak); }
  .tool-name { font-family: var(--font-mono); font-size: 13px; }
  .badge { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .03em; }
  .badge.read { background: rgba(142,142,147,.18); color: var(--text-dim); }
  .badge.execute { background: var(--accent-weak); color: var(--accent); }
  .badge.write { background: rgba(255,159,10,.16); color: var(--believed); }
  .badge.ok { background: rgba(48,209,88,.16); color: var(--verified); }
  .badge.fail { background: rgba(255,69,58,.16); color: #ff453a; }
  .tool-body { padding: 0 14px 12px; }
  .tool-body pre { font-family: var(--font-mono); font-size: 12px; line-height: 1.5;
    background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px;
    overflow-x: auto; margin: 0; max-height: 260px; white-space: pre; }
  .finding { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; padding: 8px 12px;
    border-radius: 10px; background: var(--bg-elev); border: 1px solid var(--border); }
  .tier { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; margin-top: 1px;
    text-transform: uppercase; letter-spacing: .03em; flex: none; }
  .tier.believed { background: rgba(255,159,10,.16); color: var(--believed); }
  .tier.observed { background: var(--accent-weak); color: var(--observed); }
  .tier.verified { background: rgba(48,209,88,.16); color: var(--verified); }
  .muted { color: var(--text-dim); font-size: 13px; }
  .empty { color: var(--text-dim); text-align: center; margin-top: 60px; font-size: 14px; }
  .empty .big { font-size: 34px; margin-bottom: 10px; opacity: .5; }

  /* right pane tabs */
  .tabs { display: flex; gap: 4px; }
  .tab { font-size: 12px; padding: 5px 12px; border-radius: 8px; cursor: pointer; color: var(--text-dim);
    text-transform: none; letter-spacing: 0; font-weight: 500; }
  .tab.active { background: var(--accent-weak); color: var(--accent); }
  .pane { display: none; height: 100%; }
  .pane.active { display: block; }
  #editorPane { padding: 0; }
  .CodeMirror { height: 100% !important; font-family: var(--font-mono) !important;
    font-size: 12.5px; background: var(--bg-sunken) !important; }
  .view-select { margin: 10px 18px; }
  .report h3 { font-size: 15px; margin: 2px 0 10px; }
  .report .kv { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .report pre { white-space: pre-wrap; font-family: var(--font-ui); font-size: 14px; line-height: 1.55;
    background: var(--bg-sunken); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .caps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cap { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 8px 11px;
    background: var(--bg-sunken); border: 1px solid var(--border); border-radius: 10px; }
  .cap .mk { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); }
  .cap.on .mk { background: var(--verified); }
  @media (max-width: 1000px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr 1fr; }
    .col + .col { border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <div class="dot" id="statusDot"></div>
  <div class="brand"><b>ReverseAI</b><span>autonomous reverse-engineering engineer</span></div>
  <div class="spacer"></div>
  <div class="pill" id="capsPill">checking host…</div>
  <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
</header>

<main>
  <!-- left: control -->
  <section class="col">
    <div class="col-head">Investigation</div>
    <div class="col-body">
      <label for="goal">Goal</label>
      <textarea id="goal" placeholder="e.g. Explain what this binary does and verify it by running it in the sandbox."></textarea>

      <label for="target">Target binary (path)</label>
      <input type="text" id="target" placeholder="/path/to/app  (PE / ELF / Mach-O)" />

      <label for="project">Project directory (for coding tasks)</label>
      <input type="text" id="project" placeholder="optional — enables file + run tools" />

      <div class="row">
        <div>
          <label for="provider">Model provider</label>
          <select id="provider">
            <option value="deepseek">DeepSeek</option>
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="openai">OpenAI-compatible</option>
            <option value="mock">Mock (offline)</option>
          </select>
        </div>
        <div>
          <label for="permission">Permission</label>
          <select id="permission">
            <option value="read">Read only</option>
            <option value="execute" selected>Execute (sandbox)</option>
            <option value="write">Write (modify)</option>
          </select>
        </div>
      </div>

      <button class="run" id="runBtn">Start investigation</button>

      <div class="history">
        <h4>Recent jobs</h4>
        <div id="history"></div>
      </div>
    </div>
  </section>

  <!-- center: live activity -->
  <section class="col">
    <div class="col-head">Live activity <span class="spacer"></span><span class="muted" id="activityMeta"></span></div>
    <div class="col-body" id="stream">
      <div class="empty"><div class="big">⟲</div>Describe a goal and press Start.<br/>You'll see every step the agent takes, live.</div>
    </div>
  </section>

  <!-- right: editor / report / caps -->
  <section class="col">
    <div class="col-head">
      <div class="tabs">
        <div class="tab active" data-pane="report">Report</div>
        <div class="tab" data-pane="editor">Code / Output</div>
        <div class="tab" data-pane="caps">Host</div>
      </div>
    </div>
    <div class="col-body" style="padding:0; display:flex; flex-direction:column;">
      <div class="pane active report" id="reportPane" style="padding:18px; overflow:auto;">
        <div class="muted">The verified report appears here when the investigation completes.</div>
      </div>
      <div class="pane" id="editorPane" style="flex:1; min-height:0; display:flex; flex-direction:column;">
        <select class="view-select" id="viewSelect"><option value="">— tool outputs will appear here —</option></select>
        <div style="flex:1; min-height:0;"><textarea id="editor"></textarea></div>
      </div>
      <div class="pane caps" id="capsPane" style="padding:18px; overflow:auto;">
        <div class="caps-grid" id="capsGrid"></div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/gas/gas.min.js"></script>
<script src="app.js"></script>
</body>
</html>
