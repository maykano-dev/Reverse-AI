# Render Blueprint for ReverseAI — one-click deploy.
#
# Create a new Blueprint on https://render.com pointing at this repo, then set
# the secrets marked sync:false in the dashboard. The app is public, so it
# REQUIRES an access token; the UI will ask for it on first load.
#
# Sandbox note: untrusted-code EXECUTION needs unprivileged user namespaces,
# which Render's managed runtime disables. Analysis, chat, research, memory,
# routines, decompilation, and website cloning all work there; for full
# sandboxed execution, deploy on a VM/VPS that allows user namespaces.
services:
  - type: web
    name: reverseai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /config
    autoDeploy: true
    envVars:
      # Required: a token users must enter to use this public instance.
      - key: REVERSEAI_AUTH_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: REVERSEAI_PROVIDER
        value: deepseek
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: REVERSEAI_STORE
        value: /data/jobs
      # Only paths under these roots can be opened by API callers.
      - key: REVERSEAI_ALLOWED_ROOTS
        value: /data
      # A hard ceiling on paid-model spend. Raise or remove deliberately.
      - key: REVERSEAI_MONTHLY_BUDGET
        value: "10"
      - key: REVERSEAI_MAX_REPAIR_ATTEMPTS
        value: "3"
      # Optional: HMAC key for signed verification reports. Set it here, not
      # in the browser. Without it reports use a plain SHA-256 integrity hash.
      - key: REVERSEAI_REPORT_KEY
        sync: false
      - key: REVERSEAI_UPLOAD_MAX_MB
        value: "512"
      # Headless Chromium parsing an untrusted page is an attack surface on a
      # shared host; leave rendering off and use the static clone engine.
      - key: REVERSEAI_ALLOW_BROWSER_RENDER
        value: "0"
      # Optional: point at a self-hosted Unlimited-OCR (vLLM/SGLang) endpoint.
      - key: REVERSEAI_OCR_URL
        sync: false
      # Optional: a SearXNG-compatible JSON search endpoint for research.
      - key: REVERSEAI_SEARCH_URL
        sync: false
    disk:
      name: reverseai-data
      mountPath: /data
      sizeGB: 1
