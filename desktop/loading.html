<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #0e1526; color: #eef3ff;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
  }
  .mark { font-size: 30px; font-weight: 700; letter-spacing: .5px; }
  .mark span { color: #4f8cff; }
  .sub { color: #9db2d6; font-size: 13px; }
  .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(79,140,255,.25); border-top-color: #4f8cff;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="mark">Reverse<span>AI</span></div>
  <div class="ring"></div>
  <div class="sub">Starting the local engine...</div>
</body>
</html>
